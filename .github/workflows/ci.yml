name: PHP CI Pipeline

on:
  push:
    branches:
      - principal

  pull_request:
    branches:
      - principal

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar projeto
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Verificar versão do PHP
        run: php -v

      - name: Validar sintaxe PHP
        run: php -l index.php
